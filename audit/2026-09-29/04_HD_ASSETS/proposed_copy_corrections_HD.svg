<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440"><title>proposed copy corrections HD — proposed illustration</title><rect width="2560" height="1440" fill="#061522"/><text x="100" y="150" font-size="66" fill="#FFFFFF" font-family="sans-serif">PUBLIC CONTENT CORRECTIONS — PROPOSED</text><text x="100" y="250" font-size="32" fill="#D2AD62" font-family="sans-serif">Every fact requires approved company evidence. These are copy directions.</text><text x="100" y="350" font-size="40" fill="#D2AD62" font-family="sans-serif">Availability Active →</text><text x="100" y="430" font-size="38" fill="#FFFFFF" font-family="sans-serif">Sourcing opportunity; status subject to lot review</text><text x="100" y="550" font-size="40" fill="#D2AD62" font-family="sans-serif">Download Product Sheet →</text><text x="100" y="630" font-size="38" fill="#FFFFFF" font-family="sans-serif">Request product sheet, or actual approved download</text><text x="100" y="750" font-size="40" fill="#D2AD62" font-family="sans-serif">Sovereign trade office →</text><text x="100" y="830" font-size="38" fill="#FFFFFF" font-family="sans-serif">Berbera-based trade office unless mandate documented</text><text x="100" y="950" font-size="40" fill="#D2AD62" font-family="sans-serif">Generic Verified evidence →</text><text x="100" y="1030" font-size="38" fill="#FFFFFF" font-family="sans-serif">What we check before an offer</text><text x="100" y="1150" font-size="40" fill="#D2AD62" font-family="sans-serif">Read more / Coming soon →</text><text x="100" y="1230" font-size="38" fill="#FFFFFF" font-family="sans-serif">Publish real brief, or honest non-clickable preparation notice</text></svg>