<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800"><title>evidence checks reference — proposed illustration</title><rect width="2400" height="1800" fill="#F4F1EA"/><text x="160" y="180" fill="#171D22" font-size="88" font-family="sans-serif">WHAT WE CHECK BEFORE AN OFFER</text><text x="160" y="265" fill="#171D22" font-size="38" font-family="sans-serif">Process reference — these are not completed lot approvals</text><rect x="160" y="390" width="1000" height="310" rx="16" fill="#0B2237"/><text x="220" y="500" fill="#D2AD62" font-size="56" font-family="sans-serif">ORIGIN</text><text x="220" y="595" fill="white" font-size="35" font-family="sans-serif">Traceable source record</text><rect x="1220" y="390" width="1000" height="310" rx="16" fill="#0B2237"/><text x="1280" y="500" fill="#D2AD62" font-size="56" font-family="sans-serif">AUTHORITY</text><text x="1280" y="595" fill="white" font-size="35" font-family="sans-serif">Right to sell material</text><rect x="160" y="790" width="1000" height="310" rx="16" fill="#0B2237"/><text x="220" y="900" fill="#D2AD62" font-size="56" font-family="sans-serif">ASSAY</text><text x="220" y="995" fill="white" font-size="35" font-family="sans-serif">Representative sampling</text><rect x="1220" y="790" width="1000" height="310" rx="16" fill="#0B2237"/><text x="1280" y="900" fill="#D2AD62" font-size="56" font-family="sans-serif">SPECIFICATION</text><text x="1280" y="995" fill="white" font-size="35" font-family="sans-serif">Material and quality basis</text><rect x="160" y="1190" width="1000" height="310" rx="16" fill="#0B2237"/><text x="220" y="1300" fill="#D2AD62" font-size="56" font-family="sans-serif">COMPLIANCE</text><text x="220" y="1395" fill="white" font-size="35" font-family="sans-serif">Required review and documents</text><rect x="1220" y="1190" width="1000" height="310" rx="16" fill="#0B2237"/><text x="1280" y="1300" fill="#D2AD62" font-size="56" font-family="sans-serif">MOVEMENT</text><text x="1280" y="1395" fill="white" font-size="35" font-family="sans-serif">Quote-based logistics readiness</text></svg>